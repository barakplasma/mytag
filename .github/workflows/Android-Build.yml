name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.workers.max=2
        -Xmx4g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'eas.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Ensure EAS project is configured
        run: |
          if ! grep -q 'projectId' app.json; then
            echo "No EAS projectId found in app.json, running eas init..."
            npx eas-cli init --non-interactive
          fi

      - name: Build Android APK
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --local --output=./mytag.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mytag-android-apk
          path: ./mytag.apk
          retention-days: 30
